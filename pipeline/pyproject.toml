[project]
name = "nimbus"
version = "0.1.0"
description = "Image-processing pipeline for the HackMIT look camera: steal a photo's look, paint with the world."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "qrcode>=8.0",
    "onnxruntime>=1.18",
]

[project.scripts]
nimbus = "nimbus.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
